<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    >  
    <link rel="stylesheet" href="./assets/css/site.css">
    <title>The Night Cage</title>
</head>
<body>
    <div class="container" aria-roledescription="Container for game setup">
        <div aria-roledescription="Container for Player Count" class="row">
            <div id="player-count-div" 
                aria-roledescription="Container for Player Count Radio Buttons" 
                class="row"
            >
                    <div class="col-auto">
                        <span class="text-body bg-body">Select Number of Players: </span>
                    </div>
                    <div class="col-auto">
                        <input id="rb-up-to-four" type="radio" class="form-check-input" name="player-count" value="4" checked/>
                        <label for="rb-up-to-four" class="form-check-label">1-4</label>
                    </div>
                    <div class="col-auto">
                        <input id="rb-five" type="radio" name="player-count" value="5" class="ms-1 form-check-input"/>
                        <label for="rb-five" class="form-check-label">5</label>
                    </div>
            </div>
        </div>
        <div class="d-flex align-items-center">
                <label for="use-keeper-and-pitfiend-cbx" class="pe-1 form-check-label">
                    Check to use Keepers and Pitfiend (Advanced):
                </label>
                <input id="use-keeper-and-pitfiend-cbx" type="checkbox" class="form-check-input" value="true"/>
        </div>
    </div>
        <div class="container pb-3 pt-1" aria-roledescription="Container for drawing/discarding buttons">
        <button 
            class="btn btn-outline-danger m-1" 
            id="create-game-btn"
            onclick="StartGame()"
        >
            Start Game
        </button>
        <button 
            class="btn btn-outline-danger m-1" 
            id="end-game-btn"
            onclick="EndGame()"
        >
            End Game
        </button>
    </div>   
    <div class="container">
        <audio id="game-music-player" src="./assets/wav/PlayOnLoop-horror-ambience-3-short.wav" controls="controls" loop="loop"></audio>
    </div>
    <div class="container" aria-roledescription="Container to hold Tile Image">
        <div class="d-flex flex-row">
            <div class="text-center">
                <span class="text-danger h2" id="current-piece-description">Nick</span>
                <div>
                    <img class="rounded-5" id="current-piece" src=""/>
                </div>
            </div>
            <div class="text-center">
                <span class="text-danger ps-3 h2">Played</span>
                <div id="played-div" class="d-flex flex-column-reverse ps-3 overflow-y-scroll">                          
                </div>
            </div>            
            <div class="text-center">
                <span class="text-danger ps-3 h2">Discard</span>
                <div id="discarded-div" class="d-flex flex-column-reverse ps-3 overflow-y-scroll">                          
                </div>
            </div>
        </div>
    </div>
    <div class="container pt-3" aria-roledescription="Container for gameplay buttons">
        <button 
            class="btn btn-outline-danger m-1" 
            id="draw-btn"
            onclick="DrawTile()"
        >
            DRAW
        </button>
        <button 
            class="btn btn-outline-primary m-1" 
            id="mark-placed-btn"
            onclick="HandleTilePlaced()"
        >
            Tile Placed
        </button>
        <button 
            class="btn btn-outline-warning m-1" 
            id="discard-btn"
            onclick="HandleDiscardTile()"
        >
            DISCARD
        </button>
        <button 
            class="btn btn-outline-warning m-1" 
            id="wax-eater-attack-btn"
            onclick="HandleWaxEaterAttack()"
        >
            Wax Eater Attack Discard
        </button>
        <button 
            class="btn btn-outline-warning m-1" 
            id="range-keeper-attack-btn"
            onclick="HandleKeeperRangeAttack()"
        >
            Keeper Ranged Attack Discard
        </button>
        <button 
            class="btn btn-outline-warning m-1" 
            id="melee-keeper-attack-btn"
            onclick="HandleKeeperMeleeAttack()"
        >
            Keeper Melee Attack Discard
        </button>
    </div>
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous">
    </script>
    <script src="./assets/js/site.js"></script>
</body>
</html>
